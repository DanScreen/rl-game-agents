# CartPole with PPO. Usually reaches 500 within 100-200k steps (~1-2 minutes).
env: cartpole
seed: 0
total_steps: 200000
num_envs: 8
threads: 1
algo:
  name: ppo
  lr: 0.00025
  num_steps: 128
  gamma: 0.99
  gae_lambda: 0.95
  num_minibatches: 4
  update_epochs: 4
  clip_coef: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  hidden: [64, 64]
eval:
  interval: 20000
  episodes: 10
  deterministic: true
