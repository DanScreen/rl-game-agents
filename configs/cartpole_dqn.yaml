# CartPole with Double DQN (hyperparameters adapted from RL Baselines3 Zoo).
# ~3 minutes on a laptop CPU. DQN on CartPole is famously unstable: evaluation
# scores often swing between ~100 and 500 mid-training. Annealing the learning
# rate settles it (2 of 3 seeds finish at 500), and best.pt keeps the best
# evaluated checkpoint either way. PPO (cartpole_ppo.yaml) is the more reliable choice here.
env: cartpole
seed: 0
total_steps: 50000
num_envs: 1
threads: 1
log_interval: 2000
algo:
  name: dqn
  lr: 0.0023
  anneal_lr: true
  gamma: 0.99
  buffer_size: 100000
  batch_size: 64
  learning_starts: 1000
  train_freq: 256        # collect 256 steps, then...
  gradient_steps: 128    # ...do 128 gradient steps
  target_update_interval: 256
  eps_start: 1.0
  eps_end: 0.04
  eps_fraction: 0.16
  hidden: [256, 256]
  loss: huber
eval:
  interval: 5000
  episodes: 10
  epsilon: 0.0
