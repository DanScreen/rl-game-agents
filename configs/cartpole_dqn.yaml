# CartPole with Double DQN. Solved (return 500) in ~1-3 minutes on a laptop CPU.
env: cartpole
seed: 0
total_steps: 60000
num_envs: 1
threads: 1
log_interval: 2000
algo:
  name: dqn
  lr: 0.001
  gamma: 0.99
  buffer_size: 50000
  batch_size: 64
  learning_starts: 1000
  train_freq: 1
  target_update_interval: 500
  eps_start: 1.0
  eps_end: 0.02
  eps_fraction: 0.2
  hidden: [128, 128]
  loss: mse
eval:
  interval: 5000
  episodes: 10
  epsilon: 0.0
