# Chess: value network learned by TD(lambda) from its own games (no human data,
# no engine). Moves are chosen by a 1-ply search over the value net; games mix
# self-play with games against random / greedy-material baselines.
seed: 0
total_games: 30000
threads: 1
algo:
  name: chess_td
  lr: 0.001
  hidden: [512, 256, 64]
  batch_size: 512
  buffer_size: 300000
  games_per_iter: 16
  train_steps_per_iter: 64
  td_lambda: 0.7
  max_plies: 200
  truncation_value: material
  material_scale: 5.0
  search_depth: 1
  temperature_start: 0.3
  temperature_end: 0.05
  temperature_decay_fraction: 0.5
  opening_plies_max: 6
  opponents: {self: 0.6, random: 0.2, greedy: 0.2}
eval:
  interval_games: 1000
  games: 20
  opponents: [random, greedy, minimax2]
  max_plies: 300
