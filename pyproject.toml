[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlgames"
version = "0.1.0"
description = "Training neural networks to play games (CartPole, Space Invaders, chess) with reinforcement learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "gymnasium[classic-control]>=1.0",
    "opencv-python-headless>=4.5",  # Atari preprocessing
    "ale-py>=0.9",
    "chess>=1.10",
    "imageio>=2.30",
    "imageio-ffmpeg>=0.4",
    "pillow>=10",
    "pyyaml>=6",
    "tensorboard>=2.15",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rlg = "rlgames.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
